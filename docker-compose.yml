services:
  tradebot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - tradebot-data:/app/data
      - tradebot-logs:/app/logs
    command: >-
      sh -c 'while true; do
      python main.py;
      status=$$?;
      echo "run exited with status $$status";
      sleep 3600;
      done'

volumes:
  tradebot-data:
  tradebot-logs:
